name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP tests + frontend build
    runs-on: ubuntu-latest

    # Prod runs on MySQL; test against MySQL too (matches phpunit.xml:
    # 127.0.0.1:3308 / aura_test / root with empty password). SQLite was
    # rejecting MySQL-only DDL like `ALTER TABLE ... MODIFY COLUMN`.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: aura_test
        ports:
          # Map the container's 3306 to host 3308 so phpunit.xml's DB_PORT works as-is.
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, mysqli, bcmath, gd, zip, curl
          tools: composer:v2
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Copy env and generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure MySQL test database
        run: |
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3308"
            echo "DB_DATABASE=aura_test"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD="
            echo "APP_ENV=testing"
            echo "CACHE_DRIVER=array"
            echo "SESSION_DRIVER=array"
            echo "QUEUE_CONNECTION=sync"
          } >> .env

      - name: Wait for MySQL
        run: |
          # The service health check already gates the job; this is a
          # belt-and-suspenders TCP probe that needs no mysql-client.
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3308) >/dev/null 2>&1; then
              echo "MySQL port 3308 is accepting connections"; exit 0
            fi
            echo "Waiting for MySQL ($i)..."; sleep 2
          done
          echo "MySQL did not become ready in time" >&2; exit 1

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --stop-on-failure
          else
            echo "::warning::phpunit not installed — add 'phpunit/phpunit' to composer require-dev to run tests"
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check manifest integrity
        run: |
          test -f public/build/manifest.json || (echo "manifest.json missing" && exit 1)
          for page in \
            "resources/js/Pages/Patient/OnlineConsultation/Book.vue" \
            "resources/js/Pages/Patient/OnlineConsultation/Doctors.vue" \
            "resources/js/Pages/Patient/Dashboard.vue"; do
            if ! grep -q "\"$page\"" public/build/manifest.json; then
              echo "::error::Missing $page from manifest.json"
              exit 1
            fi
          done
          echo "Manifest contains all critical page components"
